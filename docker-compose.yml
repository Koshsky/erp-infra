services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./scripts/generate-certs.sh:/usr/local/bin/generate-certs.sh:ro
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
    depends_on:
      - erp
      - frontend
    networks:
      - app-network

  erp:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: erp
    env_file:
      - .env
    volumes:
      - ./services/backend/config.yaml:/app/config.yaml:ro
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - app-network
    expose:
      - "8080"

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: frontend
    networks:
      - app-network
    expose:
      - "80"

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  flyway:
    image: flyway/flyway:9.20.0
    container_name: migrator
    volumes:
      - ./services/backend/migrations:/flyway/sql
    command:
      - -url=jdbc:postgresql://db:5432/${DATABASE_NAME}
      - -user=${DATABASE_USER}
      - -password=${DATABASE_PASSWORD}
      - -locations=filesystem:/flyway/sql,filesystem:/flyway/sql/plugins,filesystem:/flyway/sql/seed
      - migrate
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
    # Явная подсеть, чтобы IP контейнеров (в т.ч. nginx) были стабильны между
    # пересозданиями. Значение должно совпадать с trusted_proxies в
    # services/backend/config.yaml — иначе Gin не будет доверять nginx как
    # источнику реального IP клиента, и per-IP rate limit сломается.
    ipam:
      config:
        - subnet: 172.18.0.0/16