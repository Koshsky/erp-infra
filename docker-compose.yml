services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./scripts/generate-certs.sh:/usr/local/bin/generate-certs.sh:ro
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
    depends_on:
      erp:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app-network

  erp:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: erp
    env_file:
      - .env
    volumes:
      - ./services/backend/config.yaml:/app/config.yaml:ro
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app-network
    expose:
      - "8080"
    # Liveness via the unauthenticated /api/v1/health endpoint (alpine/busybox
    # wget, inside the container against the app itself — not through nginx).
    # nginx depends on this condition so it only starts once the API is ready.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - app-network
    expose:
      - "6379"
    # Rate limiter backend (M1): shared token buckets across api instances.
    # Fail-open in the app (in-memory fallback) if Redis is unavailable.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP/gRPC collector (backend: jaeger:4317)
    networks:
      - app-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: frontend
    networks:
      - app-network
    expose:
      - "80"

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  flyway:
    image: flyway/flyway:9.20.0
    container_name: migrator
    volumes:
      - ./services/backend/migrations:/flyway/sql
    command:
      - -url=jdbc:postgresql://db:5432/${DATABASE_NAME}
      - -user=${DATABASE_USER}
      - -password=${DATABASE_PASSWORD}
      - -locations=filesystem:/flyway/sql,filesystem:/flyway/sql/plugins,filesystem:/flyway/sql/seed
      - -outOfOrder=true
      - migrate
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ----- audit-log storage: Grafana Loki + Grafana UI -----
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Default admin credentials are set from the repo .env (dev stack).
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - app-network

volumes:
  db_data:
  loki_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
    # Explicit subnet so container IPs (incl. nginx) stay stable across
    # recreations. The value must match trusted_proxies in
    # services/backend/config.yaml — otherwise Gin will not trust nginx as
    # the real client-IP source and the per-IP rate limit breaks.
    ipam:
      config:
        - subnet: 172.18.0.0/16