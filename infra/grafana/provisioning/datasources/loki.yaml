# Grafana provisioning: Loki datasource (the audit-log store).
# The datasource is available to every user; only the ERP admin page is the
# main entry point, Grafana is for ad-hoc LogQL browsing.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000