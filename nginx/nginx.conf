# HTTP → HTTPS (Service Worker работает только в secure context)
server {
    listen 80;
    server_name resource-planning.mvs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name resource-planning.mvs;

    # Самоподписанный сертификат (генерируется scripts/generate-certs.sh или
    # автоматически при старте контейнера через nginx/docker-entrypoint.d/10-certs.sh)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security-заголовки (AD-12). Действуют на /api и /swagger; в location / их
    # дублируем целиком — nginx: add_header в location заменяет унаследованный
    # набор, а не дополняет.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS — «заготовка»: реально заработает с доменом и доверенным сертификатом
    # (для IP/localhost браузер заголовок игнорирует), см. AD-03/AD-11.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API proxy → Go backend
    location /api/ {
        proxy_pass http://erp:8080;
        proxy_set_header Host $host;
        # Перезаписываем, а не добавляем к клиентскому заголовку: иначе клиент
        # может подставить свой IP в начало X-Forwarded-For и обойти per-IP
        # rate limiter в backend (см. trusted_proxies в config.yaml).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI → Go backend (только с машины-хоста: loopback + docker-gateway, AD-08).
    # В docker-стеке запросы с хоста приходят от source = gateway моста (172.18.0.1,
    # subnet зафиксирована в docker-compose.yml) — без него хост-доступ тоже
    # отрубится. Сеть/LAN → 403. Сам редирект = /swagger обслуживается в rewrite-фазе
    # (до access), но целиком ведёт на защищённый /swagger/ — контента не отдаёт.
    location = /swagger {
        allow 127.0.0.1;
        allow ::1;
        allow 172.18.0.1;
        deny all;
        return 301 /swagger/;
    }
    location /swagger/ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.18.0.1;
        deny all;
        proxy_pass http://erp:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA → frontend. Полный набор заголовков здесь (наследование от server
    # заглушает собственный add_header) + CSP под сборку: внешние модули без
    # инлайн-скриптов, style 'unsafe-inline' нужен Vue `:style`, img — внешний
    # favicon, connect-src 'self' (API same-origin через /api/v1).
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://service.mvsservice.ru; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}