# HTTP → HTTPS (a Service Worker works only in a secure context)
server {
    listen 80;
    server_name resource-planning.mvs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name resource-planning.mvs;

    # Self-signed certificate (generated by scripts/generate-certs.sh or
    # automatically at container start via nginx/docker-entrypoint.d/10-certs.sh)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers (AD-12). Apply to /api and /swagger; in location / they are
    # duplicated in full — nginx: add_header inside a location replaces the
    # inherited set instead of appending to it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS — a "placeholder": it becomes effective with a real domain and a trusted
    # certificate (for IP/localhost browsers ignore the header), see AD-03/AD-11.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API proxy → Go backend
    location /api/ {
        proxy_pass http://erp:8080;
        proxy_set_header Host $host;
        # Overwrite instead of appending to the client header: otherwise the client
        # could prepend its own IP to X-Forwarded-For and bypass the per-IP
        # rate limiter in the backend (see trusted_proxies in config.yaml).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI → Go backend (host machine only: loopback + docker-gateway, AD-08).
    # In the docker stack, requests from the host arrive from source = bridge
    # gateway (172.18.0.1, subnet fixed in docker-compose.yml) — without it,
    # host access would be cut off too. Network/LAN → 403. The redirect itself
    # (/swagger) is served in the rewrite phase (before access) but leads to the
    # protected /swagger/ — no content is served.
    location = /swagger {
        allow 127.0.0.1;
        allow ::1;
        allow 172.18.0.1;
        deny all;
        return 301 /swagger/;
    }
    location /swagger/ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.18.0.1;
        deny all;
        proxy_pass http://erp:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA → frontend. The full header set lives here (inheritance from server
    # suppresses its own add_header) + CSP tuned for the build: external modules
    # without inline scripts, style 'unsafe-inline' needed by Vue `:style`,
    # img — the external favicon, connect-src 'self' (same-origin API via /api/v1).
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://service.mvsservice.ru; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}